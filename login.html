<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>

        <link rel="stylesheet" href="css/fontawesome-free-7.3.1-web/css/all.min.css">
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>
        <div class="login-container">
            <div class="login-header">
                <i class="fa-solid fa-circle-user"></i>
                <h2>Login</h2>
            </div>
            <div class="login-form">
                <form action="login.html" method="post">
                    <div class="form-group">
                        <label for="username">Usuário</label>
                        <div class="form-input">
                            <input type="email" id="username" name="username" placeholder="Digite o seu usuário..." required>
                            <i class="fa-solid fa-user"></i>
                        </div>                        
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="form-input">
                            <input type="password" id="password" name="password" placeholder="Digite a sua senha..." required>
                            <i class="fa-solid fa-lock"></i>
                        </div>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="form-check" name="form-check" checked>
                        <label for="password">Lembrar-me</label>
                    </div>                    
                    <div class="login-action">
                        <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i>Entrar</button>
                    </div>
                </form>
            </div>
            <div class="login-footer">
                <a href="#">Hospital Municipal do Lucapa</a>
            </div>
        </div>
    </body>
</html>
