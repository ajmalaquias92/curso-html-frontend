<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>

        <link rel="stylesheet" href="css/fontawesome-free-7.3.1-web/css/all.min.css">
        <link rel="stylesheet" href="css/form-login__order.css">
    </head>
    <body>
        <div class="container">
            <div class="panel">
                <div class="container-left">
                    <img src="img/img_1.png" alt="Insignia da República de Angola">
                    <p>República de Angola</p>
                    <p>Administração Municipal do Lucapa</p>
                    <p><span>Hospital Municipal</span></p>
                    <h1>Bem-vindo</h1>
                </div>
                <div class="container-right">
                    <div class="form-login">
                        <div class="form-login__header">
                            <img src="img/img_login.gif" alt="Icone de login">
                            <h2>Login</h2>
                        </div>
                        <div class="form-login__screen">
                            <form action="#" method="post">
                                <div class="form-group">
                                    <label for="username">User</label>
                                    <div class="form-input">
                                        <input type="email" name="username" id="username" placeholder="Enter username" required>
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="password">Password</label>
                                    <div class="form-input">
                                        <input type="password" name="password" id="password" placeholder="Enter password" required>
                                        <i class="fa-solid fa-lock"></i>
                                    </div>
                                </div>
                                <div class="form-check">
                                    <label for="remember-me">Remember-me</label>
                                    <input type="checkbox" name="remember-me" id="remember-me" checked>
                                </div>
                                <div class="form-group__action">
                                    <button type="submit"><i class="fa-sharp fa-solid fa-right-to-bracket"></i>Entrar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container-footer">
                <a href="#">Hospital Municipal do Lucapa &copy; 2026</a>
            </div>
        </div>
    </body>
</html>
